<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Transactions - Wallet Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen max-w-md mx-auto bg-white">

    <header class="px-5 pt-6">

        <div class="flex items-center gap-3">

            <button
                onclick="history.back()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-xl"
                aria-label="Go back"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Transactions
            </h1>

        </div>

        <input
            type="text"
            placeholder="Search transactions..."
            class="w-full mt-4 p-3 bg-gray-100 rounded-xl outline-none"
        >

    </header>


    <main class="px-5 mt-5">

        <div class="flex gap-2 mb-5">

            <button class="px-4 py-2 bg-black text-white rounded-full text-sm">
                All
            </button>

            <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">
                Income
            </button>

            <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">
                Expenses
            </button>

        </div>


        <div class="space-y-5">

            <div>

                <p class="text-sm font-semibold text-gray-500 mb-3">
                    Today
                </p>

                <div class="space-y-4">

                    <div class="flex justify-between">

                        <div>
                            <p class="font-medium">Food</p>
                            <p class="text-xs text-gray-500">
                                GCash
                            </p>
                        </div>

                        <p class="text-red-500 font-semibold">
                            -₱250
                        </p>

                    </div>


                    <div class="flex justify-between">

                        <div>
                            <p class="font-medium">Transportation</p>
                            <p class="text-xs text-gray-500">
                                Cash
                            </p>
                        </div>

                        <p class="text-red-500 font-semibold">
                            -₱100
                        </p>

                    </div>

                </div>

            </div>


            <div>

                <p class="text-sm font-semibold text-gray-500 mb-3">
                    Yesterday
                </p>

                <div class="flex justify-between">

                    <div>
                        <p class="font-medium">Salary</p>
                        <p class="text-xs text-gray-500">
                            GoTyme
                        </p>
                    </div>

                    <p class="text-green-500 font-semibold">
                        +₱25,000
                    </p>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
