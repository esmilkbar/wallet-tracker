<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Settings - Wallet Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen max-w-md mx-auto bg-white">

    <header class="px-5 pt-6">

        <div class="flex items-center gap-3">

            <button
                onclick="history.back()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-xl"
                aria-label="Go back"
            >
                ←
            </button>

            <h1 class="text-2xl font-bold">
                Settings
            </h1>

        </div>

    </header>


    <main class="px-5 mt-6">

        <div class="divide-y">

            <button class="w-full text-left py-4">
                Profile
            </button>

            <button class="w-full text-left py-4">
                Currency
            </button>

            <button class="w-full text-left py-4">
                Appearance
            </button>

            <button class="w-full text-left py-4">
                Notifications
            </button>

            <button class="w-full text-left py-4 text-red-500">
                Logout
            </button>

        </div>

    </main>

</div>

</body>
</html>
