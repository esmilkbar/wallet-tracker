<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Budgets - Wallet Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen max-w-md mx-auto bg-white">

    <header class="px-5 pt-6">

        <div class="flex items-center gap-3">

            <button
                onclick="history.back()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-xl"
                aria-label="Go back"
            >
                ←
            </button>

            <div>
                <h1 class="text-2xl font-bold">
                    Budgets
                </h1>

                <p class="text-sm text-gray-500">
                    Manage your monthly spending limits
                </p>
            </div>

        </div>

    </header>


    <main class="px-5 mt-6">

        <div class="p-5 bg-gray-50 rounded-xl">

            <div class="flex justify-between">

                <div>
                    <p class="font-semibold">
                        Food
                    </p>

                    <p class="text-sm text-gray-500">
                        ₱3,500 of ₱5,000
                    </p>
                </div>

                <p class="font-semibold">
                    70%
                </p>

            </div>


            <div class="w-full bg-gray-200 rounded-full h-2 mt-4">

                <div
                    class="bg-black h-2 rounded-full"
                    style="width: 70%"
                ></div>

            </div>

        </div>


        <button
            class="w-full mt-5 bg-black text-white py-3 rounded-xl"
        >
            + Add Budget
        </button>

    </main>

</div>

</body>
</html>
