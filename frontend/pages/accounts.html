<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accounts - Wallet Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="min-h-screen max-w-md mx-auto bg-white">

    <header class="px-5 pt-6 pb-4">

        <h1 class="text-2xl font-bold">
            My Accounts
        </h1>

        <p class="text-sm text-gray-500 mt-1">
            Manage your wallets and accounts
        </p>

    </header>


    <main class="px-5">

        <div class="space-y-3">

            <div class="p-4 rounded-xl bg-gray-50 flex justify-between">

                <div>
                    <p class="font-semibold">GCash</p>
                    <p class="text-sm text-gray-500">E-Wallet</p>
                </div>

                <p class="font-bold">₱5,000</p>

            </div>


            <div class="p-4 rounded-xl bg-gray-50 flex justify-between">

                <div>
                    <p class="font-semibold">Maya</p>
                    <p class="text-sm text-gray-500">E-Wallet</p>
                </div>

                <p class="font-bold">₱3,200</p>

            </div>


            <div class="p-4 rounded-xl bg-gray-50 flex justify-between">

                <div>
                    <p class="font-semibold">GoTyme</p>
                    <p class="text-sm text-gray-500">Bank</p>
                </div>

                <p class="font-bold">₱12,500</p>

            </div>

        </div>


        <button
            class="w-full mt-6 bg-black text-white py-3 rounded-xl font-semibold"
        >
            + Add Account
        </button>

    </main>

</div>

</body>
</html>
