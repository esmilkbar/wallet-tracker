<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Wallet Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<div class="min-h-screen max-w-md mx-auto bg-white flex items-center px-6">

    <main class="w-full">

        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold">
                Wallet Tracker
            </h1>

            <p class="text-gray-500 mt-2">
                Manage your money simply.
            </p>

        </div>


        <form>

            <label class="block text-sm font-medium mb-2">
                Email
            </label>

            <input
                type="email"
                placeholder="you@example.com"
                class="w-full p-3 bg-gray-100 rounded-xl mb-5 outline-none"
            >


            <label class="block text-sm font-medium mb-2">
                Password
            </label>

            <input
                type="password"
                placeholder="••••••••"
                class="w-full p-3 bg-gray-100 rounded-xl outline-none"
            >


            <button
                type="submit"
                class="w-full bg-black text-white py-3 rounded-xl mt-6 font-semibold"
            >
                Login
            </button>

        </form>


        <p class="text-center text-sm text-gray-500 mt-6">

            Don't have an account?

            <a
                href="register.html"
                class="text-blue-600 font-medium"
            >
                Register
            </a>

        </p>

    </main>

</div>

</body>
</html>
